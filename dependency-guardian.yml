project:
  name: demo-shop
  validation_command: "pytest -q demo-app/tests"

settings:
  request_timeout_seconds: 3
  scan_timeout_seconds: 10
  max_response_bytes: 1000000
  allow_private_network_targets: true
  llm_explanations_enabled: false

dependencies:
  - id: demo-api
    name: Demo Application
    base_url: "http://localhost:8080"
    probes:
      - id: service-health
        method: GET
        path: "/health"
        expected_status_code: 200
        expected_fields: ["status", "service"]
        known_values:
          status: "ok"
      - id: backend-health-integration
        method: GET
        path: "/api/backend/health"
        expected_status_code: 200
        expected_fields: ["status", "backend_service", "upstream_url"]
      - id: backend-projects-integration
        method: GET
        path: "/api/backend/projects"
        expected_status_code: 200
        expected_fields: ["status", "upstream_url", "total", "items"]
      - id: broken-invalid-path
        method: GET
        path: "/api/broken/invalid-path"
        expected_status_code: 200

  - id: guardian-backend
    name: Guardian Backend
    base_url: "http://localhost:8000"
    probes:
      - id: backend-health
        method: GET
        path: "/api/v1/health"
        expected_status_code: 200
        expected_fields: ["status", "version"]
        known_values:
          status: "ok"
      - id: backend-projects
        method: GET
        path: "/api/v1/projects"
        expected_status_code: 200
        expected_fields: ["total", "items"]
      - id: backend-docs
        method: GET
        path: "/docs"
        expected_status_code: 200

  - id: users-api
    name: Users API
    base_url: "http://127.0.0.1:8001"
    probes:
      - id: user-profile
        method: GET
        path: "/users/u_123"
        expected_contract: user_profile

  - id: payments-api
    name: Payments API
    base_url: "http://127.0.0.1:8002"
    probes:
      - id: payment-detail
        method: GET
        path: "/payments/p_123"
        expected_contract: payment
        known_values:
          status: "paid"

  - id: search-api
    name: Search API
    base_url: "http://127.0.0.1:8003"
    probes:
      - id: search-page-one
        method: GET
        path: "/search?page=1"
        expected_contract: search_results

  - id: notification-tool
    name: Notification Tool
    base_url: "http://127.0.0.1:8004"
    probes:
      - id: notify-status
        method: GET
        path: "/status"
        expected_contract: tool_status

workflows:
  - id: user-profile
    name: User Profile Page
    dependencies: [users-api]
    source_files: ["demo-app/src/services/user_service.py"]
    fields: ["name", "email"]
    tests: ["demo-app/tests/test_user_profile.py"]

  - id: payment-dashboard
    name: Payment Dashboard
    dependencies: [payments-api]
    source_files: ["demo-app/src/services/payment_service.py"]
    fields: ["status", "amount"]
    tests: ["demo-app/tests/test_payments.py"]

  - id: user-search
    name: User Search
    dependencies: [search-api]
    source_files: ["demo-app/src/services/search_service.py"]
    fields: ["items", "page", "next_page"]
    tests: ["demo-app/tests/test_search.py"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-guardian-detection"
version = "0.1.0"
description = "Modular Detection Agent for Dependency Guardian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
dependency-guardian = "dependency_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dependency_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "venv", "__pycache__"]
